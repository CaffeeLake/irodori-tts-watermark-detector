# Build and publish the detector to GitHub Pages.
#
# The ONNX models are not in the repository (tools/export_onnx.py pulls the checkpoints
# from the sony/silentcipher Hub repo), so the workflow exports them first.
#
# Reminder: GitHub Pages cannot set response headers, so the bundle relies on
# web/coi-sw.js to supply COOP/COEP. Without cross-origin isolation onnxruntime-web
# drops to a single thread, which is 2.1x slower.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: ./build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
